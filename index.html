/* Farben und Schriften nach boule-team-braunfels.de (Hell- und Dunkelmodus) */
:root{--paper:#f2ede4;--paper-light:#fffdf8;--surface-muted:#eee2d0;--ink:#201911;--ink-soft:#5f4f3d;--line:#d7ccbc;--clay:#b56549;--rust:#7e412d;--clay-soft:#efdcd3;--green:#153729;--green-soft:#dce8df;--green-accent:#2f7354;--on-clay:#fff8ef;--notice-bg:#fff3c9;--notice-text:#65532d;--notice-border:#a57b21;--error-bg:#f8ddd4;--error-text:#842d22;--input-bg:#fffdf8;--input-border:#bcb4a1;--surface-glass:rgba(255,253,248,.88);--shadow-c:rgba(52,40,20,.2);--panel-shadow:0 18px 50px rgba(52,40,20,.08);--bg-spot-a:rgba(181,101,73,.22);--bg-spot-b:rgba(21,55,41,.22);color-scheme:light}
:root[data-theme="dark"]{--paper:#0f151a;--paper-light:#1b262d;--surface-muted:#25323c;--ink:#e8ede7;--ink-soft:#b8c4cc;--line:#34424d;--clay:#e48a5e;--rust:#eea077;--clay-soft:#523527;--green:#1d5b41;--green-soft:#24382e;--green-accent:#8fdab0;--on-clay:#24150f;--notice-bg:#3c3522;--notice-text:#f0dda3;--notice-border:#c3983d;--error-bg:#4c2924;--error-text:#ffb5a5;--input-bg:#273741;--input-border:#4a5e68;--surface-glass:rgba(27,38,45,.88);--shadow-c:rgba(0,0,0,.36);--panel-shadow:0 20px 60px rgba(0,0,0,.24);--bg-spot-a:rgba(228,138,94,.22);--bg-spot-b:rgba(100,188,146,.16);color-scheme:dark}
:root{--bg:var(--paper);--surface:var(--paper-light);--sunk:var(--surface-muted);--muted:var(--ink-soft);--accent:var(--rust);--accent-ink:var(--on-clay);--accent-soft:var(--clay-soft);--hot:var(--clay);--danger:var(--error-text);--ok:var(--green-accent);--ok-soft:var(--green-soft);--warn-soft:var(--notice-bg);--r:22px;--display:"Barlow Condensed","Arial Narrow",sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);background-color:var(--paper);background-image:radial-gradient(circle at 8% -8%,var(--bg-spot-a),transparent 30rem),radial-gradient(circle at 96% 12%,var(--bg-spot-b),transparent 34rem);background-attachment:fixed;font:15px/1.45 "Public Sans","Segoe UI",system-ui,sans-serif;transition:background-color .25s,color .25s}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.6rem;line-height:1;margin-bottom:14px}
h3{font-size:1.2rem;margin:18px 0 8px}
small,.muted{color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
header.top{width:min(1180px,calc(100% - 24px));margin:12px auto 0;border:1px solid color-mix(in srgb,var(--line) 82%,transparent);border-radius:24px;background:var(--surface-glass);box-shadow:0 12px 36px color-mix(in srgb,var(--shadow-c) 45%,transparent);backdrop-filter:blur(18px)}
.top-in{padding:12px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:13px;margin-right:auto;min-width:0}
.brand img{display:block;width:66px;height:auto;border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:12px}
.brand .logo-dark{display:none}
:root[data-theme="dark"] .brand .logo-dark{display:block}:root[data-theme="dark"] .brand .logo-light{display:none}
.brand-txt{display:flex;flex-direction:column;line-height:1}
.brand-txt b{font-family:var(--display);font-size:1.25rem;letter-spacing:.02em;text-transform:uppercase}
.brand-txt span{font-size:.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--rust);margin-top:5px}
.top select{background:var(--input-bg);border:1px solid var(--input-border);border-radius:999px;padding:8px 12px;max-width:46vw;font-weight:600}
.theme-toggle{display:inline-flex;align-items:center;gap:9px;padding:7px 12px 7px 8px;border:1px solid var(--line);border-radius:999px;color:var(--ink);background:var(--paper-light);cursor:pointer;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.theme-toggle-track{position:relative;width:33px;height:19px;border-radius:999px;background:var(--surface-muted)}
.theme-toggle-knob{position:absolute;top:2px;left:2px;display:grid;width:15px;height:15px;place-items:center;border-radius:50%;color:var(--on-clay);background:var(--rust);font-size:10px;line-height:1;transition:transform .22s,background-color .22s}
:root[data-theme="dark"] .theme-toggle-knob{transform:translateX(14px);background:var(--clay)}
nav.tabs{position:sticky;top:8px;z-index:10;width:min(1180px,calc(100% - 24px));margin:10px auto 0;border:1px solid color-mix(in srgb,var(--line) 82%,transparent);border-radius:999px;background:var(--surface-glass);backdrop-filter:blur(18px);box-shadow:0 8px 24px color-mix(in srgb,var(--shadow-c) 30%,transparent)}
.tabs-in{padding:0 14px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:14px 12px 11px;white-space:nowrap;cursor:pointer;color:var(--ink-soft);border-bottom:3px solid transparent;font-size:.79rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--clay)}
main{width:min(1180px,calc(100% - 24px));margin:0 auto;padding:18px 0 80px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--panel-shadow)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
label.f input,label.f select,.inp{height:40px;min-width:0;line-height:1.2}
label.f input[type=date]{-webkit-appearance:none;appearance:none;display:block;text-align:left}
label.f input[type=date]::-webkit-date-and-time-value{text-align:left}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.7rem;color:var(--muted);font-weight:800;letter-spacing:.1em;text-transform:uppercase}
label.f input,label.f select,textarea,.inp{background:var(--input-bg);border:1px solid var(--input-border);border-radius:12px;padding:8px 12px;color:var(--ink);font-weight:400;font-size:.95rem;letter-spacing:0;text-transform:none;width:100%}
label.chk{display:flex;gap:8px;align-items:flex-start;padding:6px 0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--clay);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;border:1px solid var(--line);background:var(--paper-light);color:var(--ink);border-radius:999px;padding:0 18px;cursor:pointer;font-size:.74rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;transition:border-color .15s,background-color .15s}
.btn:hover{border-color:var(--clay)}
.btn.primary{background:var(--rust);border-color:var(--rust);color:var(--on-clay)}
.btn.primary:hover{background:var(--clay);border-color:var(--clay)}
.btn.danger{color:var(--danger)}
.btn.test{border-style:dashed;color:var(--muted);font-weight:600;background:transparent}
.btn.sm{min-height:30px;padding:0 12px;font-size:.66rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.prow{display:grid;gap:12px;grid-template-columns:76px repeat(3,1fr);align-items:end;margin-bottom:10px}
.prow.one{grid-template-columns:repeat(3,1fr)}
.prow{position:relative}
.sugg{position:absolute;z-index:30;left:0;right:0;top:100%;margin-top:4px;background:var(--paper-light);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px color-mix(in srgb,var(--shadow-c) 60%,transparent);overflow:hidden}
.prow:not(.one) .sugg{left:88px}
.sugg .sg{padding:9px 14px;cursor:pointer;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.sugg .sg+.sg{border-top:1px solid var(--line)}
.sugg .sg.on,.sugg .sg:hover{background:var(--clay-soft)}
.sugg .sg span{color:var(--muted);font-size:.85rem}.sugg .sg small{color:var(--muted);margin-left:auto}
.prow .pno{font-size:.82rem;font-weight:700;color:var(--muted);padding-bottom:11px}
.sys{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.sys label{border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:700;background:var(--paper)}
.sys label.on{border-color:var(--clay);background:var(--clay-soft)}
.sys label.off{opacity:.5;cursor:not-allowed}
.sys input{accent-color:var(--accent)}
.note{background:var(--sunk);border-radius:14px;padding:12px 14px;color:var(--muted);font-size:.9rem;margin-top:12px}
.note.calc{background:var(--notice-bg);border:1px solid var(--notice-border);color:var(--notice-text);font-weight:600}
.statusbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:var(--r);padding:14px 18px;margin-bottom:16px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--rust);box-shadow:var(--panel-shadow)}
.statusbar.next{border-color:var(--notice-border);border-left-color:var(--notice-border);background:var(--notice-bg);color:var(--notice-text)}
.statusbar.done{border-left-color:var(--green-accent);background:var(--green-soft)}
.statusbar strong{font-family:var(--display);font-size:1.25rem;letter-spacing:.01em}
.statusbar strong{display:block}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pill{border:1px solid var(--line);background:var(--paper-light);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.8rem;font-weight:700;color:var(--ink-soft)}
.pill:hover{border-color:var(--clay);color:var(--ink)}
.pill.on{background:var(--rust);border-color:var(--rust);color:var(--on-clay)}
.rules h3{font-size:1.05rem}.rules ul,.rules ol{margin:0 0 4px;padding-left:22px}.rules li{margin:4px 0}.rules p{margin:8px 0}
.rhead{display:flex;justify-content:space-between;align-items:baseline;margin:20px 4px 8px;font-family:var(--display);font-size:1.25rem;font-weight:700;letter-spacing:.01em}
.rhead small{font-family:"Public Sans","Segoe UI",sans-serif;font-size:.78rem;font-weight:400;letter-spacing:0}
.match{display:grid;grid-template-columns:82px 1fr auto 1fr 74px;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:9px 14px;margin-bottom:7px}
.match.done{background:var(--sunk)}
.match.wait{opacity:.6}
.match.err{border-color:var(--danger);background:var(--error-bg)}
.m-court{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--rust);font-variant-numeric:tabular-nums}
.m-court.none{color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none;font-size:.78rem}
.m-a{text-align:right}
.m-a,.m-b{min-width:0;overflow-wrap:anywhere}
.m-a small,.m-b small{display:block;font-size:.76rem}
.win{font-weight:700}
.qwin,.qwin strong{color:var(--qwin)}
:root{--qwin:#b4530a}:root[data-theme="dark"]{--qwin:#f6a54a}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--qwin:#f6a54a}}
.m-sc{display:flex;gap:5px;align-items:center;font-weight:700}
input.sc{width:50px;height:40px;text-align:center;padding:6px 2px;border:1px solid var(--input-border);border-radius:12px;background:var(--input-bg);font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
input.sc::-webkit-outer-spin-button,input.sc::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input.sc:disabled{opacity:.6}
.m-no{font-size:.76rem;color:var(--muted);text-align:right}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
tr.q td:first-child{box-shadow:inset 3px 0 0 var(--green-accent)}
tr.off td{opacity:.5;text-decoration:line-through}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.bracket{display:flex;gap:18px;overflow-x:auto;padding-bottom:8px}
.bcol{display:flex;flex-direction:column;min-width:300px;flex:0 0 300px}
.bcol h4{font-family:"Public Sans","Segoe UI",sans-serif;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--rust);margin-bottom:8px;text-align:center}
.bcol-in{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:8px}
.bm{border:1px solid var(--line);border-radius:12px;background:var(--paper-light);font-size:.86rem;overflow:hidden}
.bm.ghost{visibility:hidden;height:58px}
.bm div{display:flex;justify-content:space-between;gap:8px;padding:5px 8px}
.bm div+div{border-top:1px solid var(--line)}
.bm span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm .cap{font-size:.68rem;color:var(--muted);background:var(--sunk);padding:2px 8px}
.bm .cap span{overflow:visible;flex:none}
.bm span:first-child{padding-right:2px}
.bm .tbd{color:var(--muted);font-style:italic}
.poules{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.poules .card{margin:0;padding:12px}
.tag{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 9px;background:var(--clay-soft);color:var(--rust)}
.tag.ok{background:var(--green-soft);color:var(--green-accent)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:999px;font-weight:600;z-index:90;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
#modal .card{max-width:440px;width:100%;margin:0}
[hidden]{display:none!important}
#print{display:none}
@media (max-width:640px){
  .brand img{width:52px}.brand-txt b{font-size:1.05rem}.theme-toggle .lbl{display:none}
  .top-in{padding:10px 12px}.brand{order:0;flex:1 1 auto}#theme-btn{order:1}.top select{order:2;flex:1 1 0;max-width:none}.top-in>.btn{order:3}
  nav.tabs{border-radius:18px}
  .prow,.prow.one{grid-template-columns:1fr}.prow:not(.one) .sugg{left:0}.prow .pno{padding-bottom:0}
  .match{grid-template-columns:1fr auto 1fr;row-gap:4px}
  .m-court{grid-column:1/3;grid-row:1}.m-no{grid-column:3;grid-row:1}
  .m-a{grid-row:2}.m-sc{grid-row:2}.m-b{grid-row:2}
  input.sc{width:42px}
}
@media print{
  @page{margin:12mm}
  body{background:#fff;color:#000;font-size:11pt}
  :root{--qwin:#b4530a !important}
  header.top,nav.tabs,main,#toast,#modal{display:none!important}
  body{background:#fff!important;background-image:none!important}
  #print h1,#print h2{font-family:var(--display)}
  #print{display:block}
  #print img.baum{display:block;max-width:100%;margin:0 auto;object-fit:contain}
  #print h1{font-size:16pt;margin-bottom:2mm}
  #print .sub{color:#444;margin-bottom:5mm}
  #print h2{font-size:12pt;margin:5mm 0 2mm}
  #print table{font-size:10pt}
  #print th,#print td{border-bottom:.3pt solid #999;padding:1.4mm 2mm;color:#000}
  #print th{color:#333}
  tr{break-inside:avoid}
  #print .lz{break-inside:avoid;page-break-inside:avoid;margin-bottom:8mm}
  #print .lz+.lz{break-before:page;page-break-before:always}
  #print .lz table{margin-bottom:3mm}
}
</style>

/* ===================== Turnier-Kern (ohne DOM) ===================== */
const BYE = 'BYE';

const SYSTEMS = {
  swiss: { name: 'Schweizer System', min: 4, opts: ['rounds'],
    desc: 'Feste Rundenzahl, niemand scheidet aus. Runde 1 wird frei gelost. Danach Paarung nach Töpfen gleicher Siegzahl: Innerhalb des Topfes wird nach der Rangfolge sortiert (Buchholz, Feinbuchholz, Punktedifferenz, erzielte Punkte), dann spielt der 1. gegen den 2., der 3. gegen den 4. usw. Bei ungeradem Topf wird der Bestplatzierte des nächsten Topfes hochgespielt. Das Freilos (13:7) erhält der Letzte des untersten Topfes, kein Team zweimal. Keine Begegnung doppelt. Wertung: Siege, Buchholz, Feinbuchholz, Punktedifferenz, erzielte Punkte, bei völligem Gleichstand der direkte Vergleich.' },
  maas:  { name: 'Maastrichter System', min: 4, opts: ['rounds', 'field'],
    desc: 'Vorrunden im Schweizer System (üblich: 3 Runden), danach K.O. in A/B, A/B/C oder A/B/C/D nach der Rangliste der Vorrunde – wie viele Turniere es gibt, ergibt sich aus der Teilnehmerzahl. Die Felder werden von oben voll besetzt (üblich: 16 Teams).' },
  ko:    { name: 'ACBD-K.O.', min: 8, opts: [],
    desc: 'Runde 1 wird frei gelost: Die Sieger bilden die Gruppe A, die Verlierer die Gruppe C. Erst danach wird Runde 2 gelost – getrennt innerhalb von A und innerhalb von C. Wer in A verliert, spielt im B-Turnier weiter, wer in C verliert, im D-Turnier. Nach diesen zwei Runden werden die vier Turniere ausgelost und im K.O. zu Ende gespielt. Passt ein Feld nicht auf 16 oder 32 Teams, beginnt es mit einer Cadrage; wer sie verliert, scheidet aus.' },
  melee: { name: 'Supermêlée', min: 4, opts: ['rounds'],
    desc: 'Einzelmeldung: In jeder Runde werden Partner und Gegner neu gelost. Unter 24 Spielern wird in Doubletten gespielt (bei Bedarf mit einer Triplette aufgefüllt), ab 24 Spielern in Tripletten (bei Bedarf mit möglichst wenigen Doubletten). Einzelwertung nach Siegen und Punktedifferenz. Spieler können jederzeit ein- und aussteigen.' },
  quali: { name: 'Quali (Poule + Barrage + K.O.)', min: 6, opts: ['places'],
    desc: 'Ablauf nach dem HPV-Ablaufplan zur DM-Qualifikation, mit Barrage in den Poules. Die Meldeliste ist die Setzliste des Verbands (Setzplatz = Reihenfolge). Poules zu 4 Teams, Dreierpoules nach Teilnehmerzahl immer am Ende. Je Poule werden 2 Teams gesetzt (Reihe 1 von Poule 1 abwärts, Reihe 2 von hinten), Reihe 3 und 4 werden zugelost, das Team mit der höheren Setzplatz-Nummer kommt in Reihe 4. Runde 1: Reihe 1 gegen 4 und Reihe 2 gegen 3. Runde 2: Sieger gegen Sieger (Sieger = Poule-Erster), Verlierer gegen Verlierer (Verlierer scheidet aus). Barrage: Verlierer des Siegerspiels gegen Sieger des Verliererspiels (Sieger = Poule-Zweiter). Danach Cadrage, bis ein lückenloses K.O. bis zu den Quali-Plätzen möglich ist, und K.O.-Runden. Poule und Cadrage beginnen mit 2:2.' },
};
const HAS_FINALS = { maas: 1 };
// Regeln der Turniermodi (Seite „Regeln“), gleicher Inhalt wie die Textdatei Regeln_Turniermodi.txt
const RULES = {
  all: { title: "Für alle Modi", html: "<h3>Startnummern</h3><ul><li>Die Startnummer ist die Reihenfolge der Einschreibung (1, 2, 3 ...). Sie wird nicht ausgelost und beim Start nicht umnummeriert.</li><li>Im Quali-Modus ist die Nummer gleichzeitig der Setzplatz (siehe Quali).</li></ul><h3>Ergebnisse</h3><ul><li>Gespielt wird auf 13. Ein Ergebnis über 13 wird abgelehnt („Höchstens 13 Punkte – bitte Ergebnis prüfen.“).</li><li>Unentschieden gibt es nicht, nur ganze Zahlen ab 0.</li></ul><h3>Freilos-Wertung (Schweizer, Maastrichter-Vorrunde, Supermêlée)</h3><ul><li>Ein Freilos zählt als Sieg 13:7.</li><li>Es bringt 0 Buchholz und 0 Feinbuchholz (es gibt keinen Gegner).</li><li>In den K.O.-Bäumen (Maastrichter, ACBD) und in der Quali gibt es kein 13:7: Wer dort ein Freilos hat, kommt ohne Ergebnis eine Runde weiter.</li></ul><h3>Bahnvergabe</h3><ul><li>Eine Bahn bekommt ein Spiel, sobald beide Gegner feststehen.</li><li><b>Möglichst mit einer freien Bahn Abstand</b>: zuerst wird von vorne eine freie Bahn gesucht, deren beide Nachbarbahnen frei sind. Geht das nicht mehr, werden die Lücken von hinten aufgefüllt (höchste freie Bahn zuerst).</li><li><b>Quali</b>: jeder Poule hat zwei feste Bahnen, sofern genug Bahnen eingestellt sind (siehe Quali).</li><li>Die Bahnanzahl lässt sich jederzeit ändern.</li></ul><h3>Cadrage in einem K.O.-Baum (Maastrichter und ACBD)</h3><ul><li>Hat ein Turnier (A, B, C oder D) eine Cadrage, wird sie in diesem Turnier immer erst komplett zu Ende gespielt. Solange ein Cadrage-Spiel offen ist, ruhen alle übrigen Spiele dieses Turniers. Die anderen Turniere laufen weiter.</li><li>Kein Spiel um Platz 3. Im Endstand teilen sich die Verlierer einer Runde den Platz: beide Halbfinal-Verlierer Platz 3, die Viertelfinal-Verlierer Platz 5, die Achtelfinal-Verlierer Platz 9 usw.</li></ul><h3>Rückgängig / neu aufsetzen</h3><ul><li>„Letzte Auslosung zurücknehmen“ macht die letzte Auslosung rückgängig (danach eingetragene Ergebnisse gehen verloren).</li><li>„Auslosung verwerfen und neu aufsetzen“ löscht alle Spiele, die Meldeliste bleibt, alle Teams sind wieder angemeldet.</li></ul>" },
  swiss: { title: "Schweizer System", html: "<p><b>Einstellungen</b>: Anzahl Runden (1 bis 15). Mindestens 4 Teams. Das Programm zeigt als Hinweis, wie viele Runden rechnerisch genau ein ungeschlagenes Team ergeben (aufgerundeter Zweierlogarithmus der Teamzahl, z. B. 32 Teams = 5 Runden).</p><h3>Runde 1</h3><ul><li>Wird komplett frei gelost.</li><li>Bei ungerader Teamzahl erhält ein zufällig gelostes Team das Freilos (13:7).</li></ul><h3>Ab Runde 2: Paarung nach Töpfen</h3><ul><li>Töpfe nach Anzahl Siege (alle mit 2 Siegen in einen Topf usw.).</li><li>Innerhalb des Topfes wird nach der aktuellen Rangfolge sortiert (Buchholz, Feinbuchholz, Punktedifferenz, erzielte Punkte, Startnummer).</li><li>Dann spielt der 1. gegen den 2., der 3. gegen den 4. usw.</li><li><b>Keine Begegnung doppelt</b>: Haben zwei schon gegeneinander gespielt, spielt der Höhere gegen den Nächstplatzierten, gegen den er noch nicht gespielt hat. Das Programm sucht dazu die Paarung des Topfes, die der Rangfolge am nächsten kommt und keine Wiederholung enthält.</li><li><b>Ungerader Topf</b>: Der Bestplatzierte des nächsttieferen Topfes wird hochgespielt (er rückt ans Ende des Topfes). Das Spiel wird als „hochgespielt“ markiert.</li><li>Lässt sich ein Topf gar nicht ohne Wiederholung paaren, wird trotzdem im Topf gepaart (Töpfe werden nicht zusammengelegt): Jeder nimmt den Nächstplatzierten, gegen den er noch nicht gespielt hat; gibt es keinen mehr, den Nächstplatzierten im Topf. Das Programm weist auf die Wiederholung hin. Das passiert praktisch nur, wenn mehr Runden gespielt werden, als die Teamzahl hergibt (z. B. 16 Teams mit 5 Runden, 32 Teams mit 6 Runden).</li></ul><h3>Freilos ab Runde 2</h3><ul><li><b>Bei ungerader Zahl aktiver Teams</b>: der Letzte des untersten Topfes.</li><li>Kein Team erhält ein zweites Freilos, solange es anders geht (dann der Nächsthöhere ohne Freilos).</li><li>Freilos = Sieg 13:7, 0 Buchholz.</li></ul><h3>Wertung / Tabelle (in dieser Reihenfolge)</h3><ol><li>Siege</li><li>Buchholz (Summe der Siege aller Gegner)</li><li>Feinbuchholz (Summe der Buchholzzahlen aller Gegner)</li><li>Punktedifferenz</li><li>Erzielte Punkte</li><li>Direkter Vergleich – nur bei völligem Gleichstand in 1 bis 5, zählt die Siege innerhalb der gleichstehenden Gruppe</li><li>Startnummer (niedrigere zuerst)</li></ol><h3>Abmeldung / Nachmeldung</h3><ul><li>Nach dem Start lässt sich ein Team unter „Teams“ abmelden. Es wird ab der nächsten Auslosung nicht mehr eingeteilt; seine bisherigen Ergebnisse bleiben stehen (auch für die Buchholz seiner Gegner). „Wieder anmelden“ geht jederzeit.</li><li>Ein schon ausgelostes Spiel des abgemeldeten Teams wird nicht automatisch gewertet, das Ergebnis muss eingetragen werden.</li><li>Nachmelden nach dem Start ist nicht möglich.</li></ul><h3>Zusatzrunde</h3><ul><li>Nach der letzten Runde kann eine Zusatzrunde ausgelost werden (gleiche Regeln).</li></ul>" },
  maas: { title: "Maastrichter System", html: "<p><b>Einstellungen</b>: Vorrunden (Schweizer System, üblich 3) und Feldgröße der K.O.-Turniere (4, 8, 16 oder 32 Teams, üblich 16). Mindestens 4 Teams. Vor dem Start zeigt „Turnier“ die Einteilung, die sich ergibt. Die Feldgröße lässt sich bis zur Auslosung der K.O.-Runde noch ändern.</p><h3>Vorrunde</h3><ul><li>Genau wie das Schweizer System: Runde 1 frei gelost, danach Töpfe, Freilos 13:7, gleiche Wertung inkl. direktem Vergleich.</li></ul><h3>Einteilung in A/B/C/D (Maastrichter Rest-Regel)</h3><ul><li>Grundlage ist die Rangliste der Vorrunde, nur angemeldete Teams.</li><li><b>Die Turniere werden von oben voll besetzt</b>: Plätze 1–16 = A, 17–32 = B usw. (bei Feldgröße 16).</li><li>Rest (Teams, die kein volles Feld mehr ergeben): Rest 1 bis 6 → spielt im letzten Turnier davor mit; Rest ab 7 → bildet ein eigenes Turnier.</li><li>Höchstens vier Turniere (A–D). Was darüber hinausgeht, spielt im D-Turnier mit. Ab 4 × Feldgröße + halbe Feldgröße Teams (bei 16 also ab 72) rät das Programm zu einer größeren Feldgröße.</li><li><b>Weniger Teams als eine Feldgröße</b>: ein einziges Feld („K.O.-Runde“).</li></ul><h3>Baum eines Turniers: Freilose oder Cadrage</h3><ul><li>Passt die Teamzahl genau auf 4, 8, 16, 32 …: keine Cadrage, keine Freilose.</li><li>Fehlen bis zur nächsten Baumgröße höchstens 2 Teams: mit Freilosen auffüllen (6 oder 7 Teams → Viertelfinale, 14 oder 15 → Achtelfinale).</li><li><b>Sonst</b>: Cadrage auf die kleinere Baumgröße (z. B. 9 bis 13 Teams → auf 8, 17 bis 29 → auf 16).</li><li>Freilose bzw. das Weiterkommen ohne Cadrage gehen an die Bestplatzierten der Vorrunde. Gesetzt wird nach der Standard-K.O.-Setzung: Platz 1 gegen den Letzten, Platz 8 gegen Platz 9 usw. (bei 16), d. h. die Besten treffen erst spät aufeinander. Nichts wird ausgelost. Beispiel 12 Teams: Plätze 1–4 sind direkt im Viertelfinale, Plätze 5–12 spielen die Cadrage (5–12, 6–11, 7–10, 8–9).</li></ul><h3>Beispiele (Feldgröße 16)</h3><ul><li>23 Teams → A = 16, B = 7 (Viertelfinale mit 1 Freilos)</li><li>38 Teams → A = 16, B = 22 (Cadrage: 6 Spiele auf 16)</li><li>39 Teams → A = 16, B = 16, C = 7 (1 Freilos)</li><li>44 Teams → A = 16, B = 16, C = 12 (Cadrage: 4 Spiele auf 8)</li><li>46 Teams → A = 16, B = 16, C = 14 (Achtelfinale mit 2 Freilosen)</li><li>48 Teams → 16 / 16 / 16</li><li>64 Teams → 16 / 16 / 16 / 16</li><li>70 Teams → 16 / 16 / 16 / 22 (Rest 6 geht in D)</li></ul><h3>Endstand</h3><ul><li>Je Turnier eine eigene Platzierung (A, B, C, D) nach dem K.O.-Baum, ohne Spiel um Platz 3 (geteilte Plätze, siehe „Für alle Modi“).</li><li>Wer zur Auslosung der K.O.-Runde abgemeldet war, steht unter „Nicht in der K.O.-Runde (abgemeldet)“ mit seiner Vorrunden-Wertung.</li></ul><h3>Abmeldung / Nachmeldung</h3><ul><li>In der Vorrunde wie im Schweizer System.</li><li>Wer bei der Auslosung der K.O.-Runde abgemeldet ist, wird nicht eingeteilt.</li><li>In der K.O.-Runde selbst hat Abmelden keine Wirkung auf die Spiele (kein automatisches „kampflos“) – das Ergebnis muss von Hand eingetragen werden.</li><li>Nachmelden nach dem Start ist nicht möglich.</li></ul>" },
  ko: { title: "ACBD-K.O.", html: "<p>Mindestens 8 Teams. Keine weiteren Einstellungen.</p><h3>Runde 1</h3><ul><li>Wird frei gelost. Sieger = Gruppe A, Verlierer = Gruppe C.</li><li>Bei ungerader Zahl bekommt ein zufällig gelostes Team ein Freilos und ist damit Sieger (Gruppe A), ohne Ergebnis.</li></ul><h3>Runde 2 (wird erst gelost, wenn Runde 1 komplett ist)</h3><ul><li><b>Getrennt gelost</b>: innerhalb von A und innerhalb von C.</li><li>Bei ungerader Zahl in einer Gruppe gibt es dort ein Freilos; ein Team, das schon in Runde 1 ein Freilos hatte, bekommt kein zweites (sofern möglich).</li></ul><h3>Turniere nach zwei Runden</h3><ul><li><b>A-Turnier</b>: zwei Siege</li><li><b>B-Turnier</b>: Sieg, dann Niederlage</li><li><b>C-Turnier</b>: Niederlage, dann Sieg</li><li><b>D-Turnier</b>: zwei Niederlagen</li><li>Jedes Turnier wird frei in einen K.O.-Baum gelost (keine Setzung).</li><li>Passt ein Turnier nicht genau auf 4, 8, 16, 32 …, beginnt es mit einer Cadrage auf die kleinere Baumgröße. Wer die Cadrage verliert, scheidet aus. Wer ohne Cadrage direkt weiter ist, ergibt sich aus der Auslosung. Anders als beim Maastrichter wird hier nie mit Freilosen aufgefüllt, auch wenn nur 1 oder 2 Teams fehlen (z. B. 15 Teams: 7 Cadrage-Spiele auf 8).</li><li><b>Beispiel 100 Teams</b>: A = B = C = D = 25, je Turnier Cadrage mit 9 Spielen auf 16 (7 Teams direkt weiter).</li><li>Vor dem Start zeigt „Turnier“ die Feldgrößen, Cadragen und Freilose.</li></ul><h3>Endstand</h3><ul><li>Je Turnier A–D eine Platzierung nach dem K.O.-Baum, kein Spiel um Platz 3.</li></ul><h3>Abmeldung / Nachmeldung</h3><ul><li>Abmelden und Nachmelden gibt es nach dem Start nicht.</li></ul>" },
  melee: { title: "Supermêlée", html: "<p><b>Einstellungen</b>: Anzahl Runden. Mindestens 4 Spieler. Einzelmeldung, Formation ist immer Tête-à-tête. Nicht wählbar, solange 2er- oder 3er-Teams gemeldet sind.</p><h3>Auslosung jeder Runde</h3><ul><li>In jeder Runde werden Partner und Gegner neu gelost.</li><li><b>Unter 24 aktiven Spielern</b>: Doubletten (2:2). Geht es nicht auf, wird mit einer 3:2- und/oder einer 3:3-Partie aufgefüllt.</li><li><b>Ab 24 aktiven Spielern</b>: Tripletten (3:3), aufgefüllt mit möglichst wenigen 3:2- oder 2:2-Partien; möglichst viele Tripletten, möglichst wenige Partien.</li><li>Lässt sich die Zahl nicht aufteilen (z. B. 7 Spieler), setzt ein Spieler aus. Das ist der Spieler mit den wenigsten bisherigen Aussetzern (bei Gleichheit zufällig). Aussetzen zählt als Sieg 13:7.</li><li><b>Wiederholungen werden vermieden</b>: Das Programm probiert 400 Auslosungen und nimmt die mit den wenigsten Wiederholungen. Ein schon dagewesener Partner wiegt dabei zehnmal so schwer wie ein schon dagewesener Gegner.</li></ul><h3>Wertung (Einzelwertung)</h3><ol><li>Siege</li><li>Punktedifferenz</li><li>Erzielte Punkte</li><li>Startnummer</li></ol><ul><li>(Kein Buchholz, kein direkter Vergleich.)</li></ul><h3>Ein- und Aussteigen</h3><ul><li>Spieler können jederzeit nachgemeldet werden und spielen ab der nächsten Runde mit.</li><li>Abgemeldete werden ab der nächsten Auslosung nicht mehr eingeteilt, ihre Ergebnisse bleiben in der Wertung.</li><li>Nach der letzten Runde ist eine Zusatzrunde möglich.</li></ul>" },
  quali: { title: "Quali (Poule + Barrage + K.O.)", html: "<p><b>Einstellungen</b>: Quali-Plätze (Standard 10), Bahnen. Mindestens 6 Teams, und nach den Poules müssen mindestens so viele Teams weiter sein wie es Quali-Plätze gibt.</p><h3>Setzliste</h3><ul><li>Meldeliste = Setzliste des Verbands, Setzplatz = Reihenfolge der Meldeliste.</li><li>Vor dem Start mit ▲▼ verschiebbar. Beim Excel-Import wird im Quali-Modus nach der Spalte „Setzposition“ sortiert, falls vorhanden.</li></ul><h3>Poule-Einteilung</h3><ul><li>Anzahl Poules = Teams / 4, aufgerundet. Dreierpoules: so viele, wie zu vollen Vierern fehlen; immer die letzten Poules.</li><li>Reihe 1: Setzplatz 1 bis P (Poule 1 bekommt Setzplatz 1 usw.).</li><li>Reihe 2: Setzplatz P+1 bis 2P rückwärts (letzter Poule bekommt P+1, Poule 1 bekommt 2P).</li><li>Reihe 3 und 4: alle übrigen Teams werden gemischt und zugelost (erst Reihe 3 für alle Poules, dann Reihe 4 für die Viererpoules). Von den beiden Zugelosten steht das mit der höheren Setzplatz-Nummer in Reihe 4.</li><li><b>Dreierpoule</b>: Reihe 4 ist ein Strich.</li></ul><h3>Spiele im Poule (Start bei 2:2)</h3><ul><li>Runde 1: Spiel A = Reihe 1 gegen Reihe 4, Spiel B = Reihe 2 gegen Reihe 3.</li><li>Runde 2: Siegerspiel (Sieger A – Sieger B), Sieger = Poule-Erster. Verliererspiel (Verlierer A – Verlierer B), Verlierer scheidet aus.</li><li>Runde 3: Barrage = Verlierer Siegerspiel gegen Sieger Verliererspiel, Sieger = Poule-Zweiter, Verlierer scheidet aus.</li><li>Im Dreierpoule ist Reihe 1 in Runde 1 spielfrei und steht direkt im Siegerspiel. Das Verliererspiel entfällt; der Verlierer von Spiel B geht direkt in die Barrage.</li><li><b>Feste Bahnen</b>: Sind mindestens 2 Bahnen je Poule eingestellt, spielt Poule 1 auf Bahn 1+2, Poule 2 auf 3+4 usw. (Spiel A, Siegerspiel, Barrage auf der ersten; Spiel B, Verliererspiel auf der zweiten). Sonst laufende Vergabe.</li></ul><h3>Cadrage (Start bei 2:2)</h3><ul><li><b>Ziel</b>: Quali-Plätze × 2, × 4 … (bei 10 Plätzen 10, 20, 40 …) – die größte dieser Zahlen, die nicht über der Zahl der Weitergekommenen liegt. So viele Cadrage-Spiele, wie Teams zu viel sind. Passt es genau, keine Cadrage.</li><li>Wer spielt (bis genug beisammen sind): Zweite der Dreierpoules, Zweite der Viererpoules, Erste der Dreierpoules, Erste der Viererpoules – jeweils vom höchsten Poule abwärts. Alle anderen sind ohne Cadrage weiter.</li><li><b>Paarung von außen nach innen</b>: Platz 1 der Cadrage-Liste gegen den letzten, Platz 2 gegen den vorletzten usw. Spiele mit einem Poule-Ersten bekommen einen Stern.</li></ul><h3>K.O.-Runden (Start bei 0:0, keine Freilose)</h3><ul><li>Hilfsliste für Runde 1: Poule-Erste ohne Cadrage (Poule 1 zuerst), Sieger der Sternspiele (nach Spielnummer), Poule-Zweite ohne Cadrage, Sieger der Spiele ohne Stern.</li><li>Runde 1: Hilfsliste von außen nach innen gepaart.</li><li>Ab Runde 2: Sieger Spiel 1 gegen Sieger des letzten Spiels usw.</li><li>Ende, wenn so viele Teams übrig sind wie Quali-Plätze.</li></ul><h3>Gleicher Poule (Cadrage und alle K.O.-Runden)</h3><ul><li>Würden zwei Teams aus demselben Poule aufeinandertreffen, wird der Gegner mit dem eines späteren Spiels getauscht (erst das nächste, dann das übernächste …), hilft das nicht, mit früheren Spielen. Getauscht wird nur, wenn danach keines der beiden Spiele ein Poule-Duell ist.</li></ul><h3>Ergebnisliste</h3><ul><li><b>Qualifiziert</b>: Sieger der letzten Runde, nummeriert nach der Hilfsliste.</li><li><b>Nachrücker</b>: Verlierer der letzten Runde (ohne K.O.-Runde: Cadrage- Verlierer), sortiert nach Setzliste, niedrigste Nummer zuerst.</li><li>Danach die Ausgeschiedenen je Runde (ohne Platzierung, mit Poule-Angabe).</li><li>Poule-Dritte gibt es nicht.</li></ul><h3>Nachmeldung</h3><ul><li><b>Nur während der Poule-Runde</b>: in den ersten Dreierpoule, in dem die zweite Runde noch nicht gespielt ist, Reihe 4 (spielt sofort gegen Reihe 1). Der Poule wird zum Viererpoule.</li><li>Gibt es keinen Dreierpoule, ist das Team nicht spielberechtigt.</li></ul><h3>Abmeldung</h3><ul><li>Jederzeit unter „Teams“. Das Team verliert sein offenes Spiel und alle weiteren Spiele kampflos 13:0, der Gegner kommt weiter („kampflos“ in Spiele). Sind beide Teams eines Spiels abgemeldet, kommt das mit der niedrigeren Setzplatz-Nummer weiter.</li><li>Wieder anmelden nur, solange auf den kampflos gewerteten Spielen noch nichts aufbaut (kein Folgespiel gespielt, nächste Runde nicht ausgelost).</li></ul>" },
};

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pkey = (a, b) => (a < b ? a + '|' + b : b + '|' + a);
const real = x => !!x && x !== BYE;
const played = m => m.sa != null && m.sb != null;
const winner = m => (m.auto ? m.auto : played(m) ? (m.sa > m.sb ? m.a : m.b) : null);
const loser = m => (m.auto ? BYE : played(m) ? (m.sa > m.sb ? m.b : m.a) : null);
const playable = m => !played(m) && !m.auto && !m.hold && (!!m.pa || (real(m.a) && real(m.b)));
const pending = m => !played(m) && !m.auto;

function newTournament(name) {
  return {
    id: 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    name: name || 'Neues Turnier', date: new Date().toISOString().slice(0, 10), place: '',
    formation: 'doublette', system: 'swiss',
    opts: { target: 13, courts: 8, rounds: 3, field: 16, byeAgainst: 7, places: 10 },
    entries: [], phases: [], matches: [], seq: 0, mno: 0, started: false,
  };
}
// Teamname (Vor- und Nachname aller Spieler) und Vereinsangabe ergeben sich aus den gemeldeten Spielern (Vorname, Name, Verein)
function composeEntry(members) {
  const ms = members.map(m => ({ first: (m.first || '').trim(), last: (m.last || '').trim(), club: (m.club || '').trim() })).filter(m => m.first || m.last);
  ms.forEach(m => { if (!m.club && ms[0].club) m.club = ms[0].club; }); // leerer Verein = Verein des ersten Spielers
  const full = m => [m.first, m.last].filter(Boolean).join(' ');
  return { members: ms, name: ms.map(full).join(' / '), club: [...new Set(ms.map(m => m.club).filter(Boolean))].join(' / '), players: ms.map(full).join(', ') };
}
function addEntry(T, o) {
  const nr = T.entries.reduce((x, e) => Math.max(x, e.nr), 0) + 1;
  const c = o.members && o.members.length ? composeEntry(o.members) : { name: (o.name || '').trim(), club: (o.club || '').trim(), players: (o.players || '').trim() };
  const e = Object.assign({ id: 'e' + (++T.seq), nr, active: true }, c);
  if (!e.name) e.name = e.players ? e.players.split(',').map(x => x.trim().split(' ').pop()).join(' / ') : 'Teilnehmer ' + nr;
  T.entries.push(e); return e;
}
const entry = (T, id) => T.entries.find(e => e.id === id);
const nrOf = (T, id) => (entry(T, id) || { nr: 0 }).nr;
const activeIds = T => T.entries.filter(e => e.active !== false).sort((a, b) => a.nr - b.nr).map(e => e.id);
function addPhase(T, o) { const p = Object.assign({ id: 'p' + (++T.seq), stage: 1 }, o); T.phases.push(p); return p; }
function addMatch(T, ph, o) {
  const m = Object.assign({ id: 'm' + (++T.seq), no: ++T.mno, ph: ph.id, round: 1, a: null, b: null, sa: null, sb: null, court: null }, o);
  T.matches.push(m); return m;
}
const phaseMatches = (T, ph) => T.matches.filter(m => m.ph === ph.id);
const maxStage = T => T.phases.reduce((x, p) => Math.max(x, p.stage), 0);
const byeScore = T => { const t = T.opts.target | 0 || 13, a = T.opts.byeAgainst == null ? 7 : T.opts.byeAgainst | 0; return [t, Math.max(0, Math.min(a, t - 1))]; };

/* ---------- Statistik & Ranglisten ---------- */
// Buchholz = Summe der Siege aller Gegner, Feinbuchholz = Summe der Buchholzzahlen aller Gegner.
// Ein Freilos zählt als Sieg, bringt aber 0 Buchholz und 0 Feinbuchholz (kein Gegner).
function stats(ms, ids) {
  const S = new Map(ids.map(id => [id, { id, g: 0, w: 0, l: 0, pf: 0, pa: 0, opp: [], bh: 0, fbh: 0, diff: 0, byes: 0 }]));
  const add = (id, f, a, o) => { const s = S.get(id); if (!s) return; s.g++; s.pf += f; s.pa += a; if (f > a) s.w++; else s.l++; if (o) s.opp.push(o); else s.byes++; };
  for (const m of ms) {
    if (!played(m) || m.auto) continue;
    if (m.pa) { m.pa.forEach(id => add(id, m.sa, m.sb, m.bye ? null : 1)); m.pb.forEach(id => add(id, m.sb, m.sa, 1)); }
    else if (m.bye) add(m.a, m.sa, m.sb, null);
    else if (real(m.a) && real(m.b)) { add(m.a, m.sa, m.sb, m.b); add(m.b, m.sb, m.sa, m.a); }
  }
  for (const s of S.values()) { s.diff = s.pf - s.pa; s.bh = s.opp.reduce((t, o) => t + (S.get(o) ? S.get(o).w : 0), 0); }
  for (const s of S.values()) s.fbh = s.opp.reduce((t, o) => t + (S.get(o) ? S.get(o).bh : 0), 0);
  return S;
}
const RANK_KEYS = { swiss: ['w', 'bh', 'fbh', 'diff', 'pf'], melee: ['w', 'diff', 'pf'] };
function standings(T, ph) {
  const ms = phaseMatches(T, ph), ids = ph.type === 'melee' ? T.entries.map(e => e.id) : ph.ids;
  const keys = RANK_KEYS[ph.type] || RANK_KEYS.swiss;
  const rows = [...stats(ms, ids).values()].sort((p, q) => { for (const k of keys) if (q[k] !== p[k]) return q[k] - p[k]; return nrOf(T, p.id) - nrOf(T, q.id); });
  if (ph.type === 'swiss') { // Direkter Vergleich als letztes Kriterium: nur bei völligem Gleichstand in allen Wertungen
    for (let i = 0; i < rows.length;) {
      let j = i + 1; while (j < rows.length && keys.every(k => rows[j][k] === rows[i][k])) j++;
      if (j - i > 1) {
        const grp = rows.slice(i, j), inG = new Set(grp.map(r => r.id)), h2h = new Map(grp.map(r => [r.id, 0]));
        ms.forEach(m => { if (played(m) && !m.bye && inG.has(m.a) && inG.has(m.b)) h2h.set(m.sa > m.sb ? m.a : m.b, h2h.get(m.sa > m.sb ? m.a : m.b) + 1); });
        grp.sort((p, q) => (h2h.get(q.id) - h2h.get(p.id)) || (nrOf(T, p.id) - nrOf(T, q.id)));
        grp.forEach(r => { r.h2h = h2h.get(r.id); }); rows.splice(i, j - i, ...grp);
      }
      i = j;
    }
  }
  rows.forEach((r, i) => { r.place = i + 1; });
  return rows;
}

/* ---------- Abhängigkeiten (Turnierbaum) ---------- */
function propagate(T) {
  const byId = new Map(T.matches.map(m => [m.id, m]));
  let changed = true, guard = 0;
  while (changed && guard++ < 64) {
    changed = false;
    for (const m of T.matches) {
      if (!m.br) continue;
      for (const side of ['a', 'b']) {
        const src = side === 'a' ? m.srcA : m.srcB; if (!src) continue;
        const sm = byId.get(src.m); const v = src.lose ? loser(sm) : winner(sm);
        if (m[side] !== v) { m[side] = v; m.sa = m.sb = null; m.court = null; delete m.wo; changed = true; }
      }
      let auto = null;
      if (m.a === BYE && m.b === BYE) auto = BYE; else if (m.a === BYE && m.b) auto = m.b; else if (m.b === BYE && m.a) auto = m.a;
      if ((m.auto || null) !== auto) { if (auto) { m.auto = auto; m.sa = m.sb = null; m.court = null; } else delete m.auto; changed = true; }
    }
  }
  if (qForfeit(T)) propagate(T);
}
// Quali: Ein abgemeldetes Team verliert jedes offene Spiel kampflos 13:0 (m.wo = abgemeldetes Team).
// Sind beide abgemeldet, gewinnt das mit dem besseren Setzplatz.
function qForfeit(T) {
  if (T.system !== 'quali') return false;

const pidKey = (f, l, c) => pdbKey(f, l) + '|' + (c || '').trim().replace(/\s+/g, ' ').toLowerCase();
function pdbFind(first, last, club) {
  const k = pdbKey(first, last), same = pdb().filter(x => pdbKey(x.first, x.last) === k); if (!same.length) return null;
  const c = pidKey(first, last, club); return same.find(x => pidKey(x.first, x.last, x.club) === c)
    || (!(club || '').trim() ? same[0] : same.find(x => !x.club)) || null; // ohne Verein: erster Treffer; Eintrag ohne Verein wird ergänzt
}
function rememberPlayers(members, count, date) {
  composeEntry(members).members.forEach(m => { // leerer Verein = Verein des ersten Spielers
    if (!m.first && !m.last) return;
    let p = pdbFind(m.first, m.last, m.club);
    if (!p) { p = { first: (m.first || '').trim(), last: (m.last || '').trim(), club: (m.club || '').trim(), n: 0, seen: '' }; pdb().push(p); }
    else if (m.club && !p.club) { p.club = m.club.trim(); }
    if (count) { p.n = (p.n || 0) + 1; p.seen = date || new Date().toISOString().slice(0, 10); }
  });
}
function pdbSearch(q, limit, field) {
  const t = q.trim().toLowerCase().split(/\s+/).filter(Boolean); if (!t.length) return [];
  return pdb().filter(p => { const s = (p.first + ' ' + p.last + ' ' + p.club).toLowerCase(); return t.every(w => s.includes(w)); })
    .map(p => { const f = p.first.toLowerCase(), l = p.last.toLowerCase(), own = field === 'last' ? l : f, other = field === 'last' ? f : l;
      const rank = t.some(w => own.startsWith(w)) ? 0 : t.some(w => other.startsWith(w)) ? 1 : 2; return { p, score: rank * 1000 - (p.n || 0) }; })
    .sort((a, b) => a.score - b.score || (a.p.last + a.p.first).localeCompare(b.p.last + b.p.first, 'de')).slice(0, limit || 8).map(x => x.p);
}

function sideText(T, m, s) {

}

}
const koRoundName = N => { let k = 0; while ((1 << (k + 1)) < N) k++; return ['Finale', 'Halbfinale', 'Viertelfinale', 'Achtelfinale'][k] || `1/${Math.pow(2, k)}-Finale`; };
function koName(ph, r) { const k = ph.koRounds - r; return ['Finale', 'Halbfinale', 'Viertelfinale', 'Achtelfinale'][k] || `1/${Math.pow(2, k)}-Finale`; }
function roundTitle(T, ph, r) {
  if (ph.type === 'cad' || ph.type === 'qcad') return 'Cadrage';
  if (ph.type === 'pre') return `${r}. Runde`;
  if (ph.type === 'poule') return r === 3 ? 'Barrage' : `Poule-Runde ${r}`;
  if (ph.type === 'qko') return `K.O.-Runde ${r}` + (r === ph.nRounds ? ' (um die Quali-Plätze)' : '');
  if (ph.type === 'ko') return r <= (ph.skip || 0) ? `${r + (ph.from || 1) - 1}. Runde` : r === 1 && ph.cadrage && ph.koRounds > 1 ? 'Cadrage' : koName(ph, r);

}
function matchTag(T, ph, m) {

  if (ph.type === 'pre' && m.round === 2) return m.kind === 'W' ? 'Gruppe A' : 'Gruppe C';
  if (ph.type === 'poule') return `Poule ${m.pool}` + ({ W: ' · Siegerspiel', L: ' · Verliererspiel' }[m.kind] || '');
  if (ph.type === 'qcad') return `Cadrage ${m.cno}${m.star ? '*' : ''}`;

}
const curStagePhases = T => T.phases.filter(p => p.stage === maxStage(T));
function defaultRound(T, ph) { return ph.type === 'qko' ? ph.round : ph.type === 'swiss' || ph.type === 'melee' || (ph.type === 'pre' && ph.round) ? ph.round : 'all'; }

  if (!T.phases.length) { UI.phase = UI.round = UI.tphase = UI.bphase = null; return; }
  const cp = curStagePhases(T); const ph = cp.find(p => phaseMatches(T, p).some(pending)) || cp[0];
  UI.phase = ph.id; UI.round = defaultRound(T, ph); UI.tphase = ph.id;
  const br = cp.find(p => p.type === 'ko'); UI.bphase = br ? br.id : null;
}
// Ist die gewählte Phase komplett erledigt, zur nächsten Phase mit offenen Spielen wechseln (z. B. Cadrage -> A-Turnier)
function autoPhase(T) {
  if (UI.phase === 'all') return;
  const ph = T.phases.find(p => p.id === UI.phase); if (!ph || phaseMatches(T, ph).some(pending)) return;

}

function matchRow(T, ph, m, locked) {

  const tag = matchTag(T, ph, m);
  const no = `<div class="m-no">Spiel ${m.no}${tag ? `<br>${esc(tag)}` : ''}</div>`;
  if (m.auto || m.bye || m.a === BYE || m.b === BYE) {
    const t = m.pa ? sideText(T, m, 'a') : m.auto ? ename(T, m.auto) : sideText(T, m, m.a === BYE ? 'b' : 'a');
    return `<div class="match done"><div class="m-court none">${ph.cadrage && m.round === 1 ? 'ohne Cadrage' : 'Freilos'}</div><div class="m-a win">${esc(t)}</div><div class="m-sc muted">${m.bye ? `${m.sa} : ${m.sb}` : 'weiter'}</div><div class="m-b muted">–</div>${no}</div>`;

  const crcT = Array.from({ length: 256 }, (_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; });

  const le = (n, w) => Array.from({ length: w }, (_, i) => (n >>> (8 * i)) & 255);
  Object.entries(files).forEach(([name, txt]) => {
    const nm = enc(name), data = enc(txt), c = crc(data), common = [...le(20, 2), ...le(0, 2), ...le(0, 2), ...le(0, 2), ...le(0x21, 2), ...le(c, 4), ...le(data.length, 4), ...le(data.length, 4), ...le(nm.length, 2), ...le(0, 2)];
    const lh = new Uint8Array([...le(0x04034b50, 4), ...common, ...nm]); parts.push(lh, data);
    cd.push(new Uint8Array([...le(0x02014b50, 4), ...le(20, 2), ...common, ...le(0, 2), ...le(0, 2), ...le(0, 2), ...le(0, 4), ...le(off, 4), ...nm])); off += lh.length + data.length;

}
const importHead = T => Array.from({ length: teamSize(T) }, (_, i) => [`Name${i + 1}`, `Vorname${i + 1}`, `Verein${i + 1}`]).flat(); // wie die Einschreibungsliste des Verbands

function demoMembers(T, k) {
  const used = new Set(T.entries.flatMap(e => membersOf(e).map(m => pdbKey(m.first, m.last)))), pick = a => a[Math.floor(Math.random() * a.length)];
  const club = pick(DEMO_C), names = new Set(T.entries.map(e => e.name));
  const one = () => { let m; for (let t = 0; t < 200; t++) { m = { first: pick(DEMO_F), last: pick(DEMO), club }; if (!used.has(pdbKey(m.first, m.last))) break; } return m; };
  let ms; for (let t = 0; t < 50; t++) { ms = Array.from({ length: k }, one); if (new Set(ms.map(m => pdbKey(m.first, m.last))).size === k && !names.has(composeEntry(ms).name)) break; } // auch der Teamname kommt nur einmal vor
  return ms;
}

// Setzliste: Team mit dem Nachbarn tauschen (nur vor dem Start)
function moveEntry(id, d) {
  const T = cur(); if (T.started) return; const L = T.entries.slice().sort((a, b) => a.nr - b.nr), i = L.findIndex(e => e.id === id), j = i + d;
  if (i < 0 || j < 0 || j >= L.length) return; const x = L[i].nr; L[i].nr = L[j].nr; L[j].nr = x; save(); render();
}
function afterDraw(T) { selDefault(T); save(); render(); }

  },
  'entry-cancel': () => { UI.editId = null; render(); },
  'entry-up': el => moveEntry(el.dataset.id, -1),
  'entry-down': el => moveEntry(el.dataset.id, 1),
  'entry-edit': el => { UI.editId = el.dataset.id; render(); window.scrollTo(0, 0); const f = $('#e-first-0'); if (f) f.focus(); },
  'entry-del': el => { const T = cur(); T.entries = T.entries.filter(e => e.id !== el.dataset.id); T.entries.sort((a, b) => a.nr - b.nr).forEach((e, i) => { e.nr = i + 1; }); save(); render(); },
  'entry-clear': () => { const T = cur(); ask(`Wirklich alle ${T.entries.length} ${who(T, true)} aus der Meldeliste löschen? Das lässt sich nicht rückgängig machen.`, () => { T.entries = []; UI.editId = null; save(); render(); toast('Meldeliste geleert.'); }, 'Alle löschen'); },
  'entry-toggle': el => {

    }

  },
  'imp-tpl': () => { const T = cur(); download('Meldeliste_Vorlage_' + (isMelee(T) ? 'Supermelee' : { tete: 'Tete-a-tete', doublette: 'Doublette', triplette: 'Triplette' }[T.formation]) + '.xlsx', xlsxFile([importHead(T)], 'Meldeliste'), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'); },

    save(); render();
  },
  print: el => printDoc(cur(), el.dataset.doc),
  jpg: el => saveJpeg(cur(), el.dataset.doc),
  'exp-pdf-end': () => savePdf(cur(), 'endstand'),
  'exp-xlsx-end': () => { const T = cur(); download(fname(T, '_Endstand.xlsx'), xlsxFile(endRows(T), T.system === 'quali' ? 'Ergebnisliste' : 'Endstand'), XLSX); },
  't-new': () => { const t = newTournament(); DB.tournaments.push(t); DB.current = t.id; UI.undo = []; UI.tab = 'turnier'; selDefault(t); save(); render(); },
  't-open': el => { DB.current = el.dataset.id; UI.undo = []; selDefault(cur()); save(); render(); },
  't-copy': el => { const s = DB.tournaments.find(t => t.id === el.dataset.id), t = newTournament(s.name + ' (Kopie)'); t.system = s.system; t.formation = s.formation; t.place = s.place; t.opts = Object.assign({}, s.opts); s.entries.forEach(e => addEntry(t, e.members && e.members.length ? { members: e.members } : e)); DB.tournaments.push(t); DB.current = t.id; UI.undo = []; UI.tab = 'turnier'; selDefault(t); save(); render(); toast('Neues Turnier mit derselben Meldeliste angelegt.'); },
  't-del': el => ask('Dieses Turnier endgültig von diesem Gerät löschen?', () => { DB.tournaments = DB.tournaments.filter(t => t.id !== el.dataset.id); if (!DB.tournaments.length) DB.tournaments.push(newTournament()); if (!DB.tournaments.some(t => t.id === DB.current)) DB.current = DB.tournaments[0].id; UI.undo = []; selDefault(cur()); save(); render(); }, 'Löschen'),
  rnd: () => {

function saveScore(row, focusNext) {
  const T = cur(), [ia, ib] = row.querySelectorAll('input.sc'), mid = row.dataset.mid, m = T.matches.find(x => x.id === mid);
  if (ia.value === '' && ib.value === '') { if (!played(m)) return; }
  else if (ia.value === '' || ib.value === '') return;
  const empty = ia.value === '', sa = empty ? null : Number(ia.value), sb = empty ? null : Number(ib.value);
  const rows = [...document.querySelectorAll('.match[data-mid]')], nextId = (rows[rows.indexOf(row) + 1] || {}).dataset;
  const apply = () => {
    if (!guard(() => setScore(T, mid, sa, sb))) { row.classList.add('err'); return; }
    autoPhase(T); save(); render();
    if (focusNext && nextId) setTimeout(() => { const el = document.querySelector(`.match[data-mid="${nextId.mid}"] input.sc:not(:disabled)`); if (el) el.focus(); }, 0);
  };
  // Prüfen, ob die Änderung bereits gespielte Folgespiele zurücksetzt
  const clone = JSON.parse(JSON.stringify(T)); let ok = true;
  try { setScore(clone, mid, sa, sb); } catch (e) { ok = false; }
  if (ok && playedCount(clone) < playedCount(T) + (played(m) ? 0 : 1) - (empty ? 1 : 0)) ask('Durch diese Änderung wechseln Teilnehmer in bereits gespielten Folgespielen. Deren Ergebnisse werden gelöscht. Fortfahren?', apply, 'Ändern');
  else apply();
}

document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; const f = ACT[el.dataset.act]; if (f) f(el); });
document.addEventListener('change', e => {
  const el = e.target, T = cur();
  if (el.id === 'tsel') { DB.current = el.value; UI.undo = []; UI.editId = null; selDefault(cur()); save(); render(); return; }
  if (el.classList.contains('sc')) { const row = el.closest('.match'); saveScore(row, el === row.querySelectorAll('input.sc')[1]); return; }
  if (el.dataset.sys) { if (el.dataset.sys === 'melee' && T.entries.some(e => membersOf(e).length > 1)) { toast('Supermêlée ist nicht wählbar, solange 2er- oder 3er-Teams gemeldet sind.'); render(); return; } T.system = el.dataset.sys; if (T.system === 'melee') T.formation = 'tete'; save(); render(); return; }
  if (el.dataset.f === 'formation' && isMelee(T)) { T.formation = 'tete'; render(); return; }
  if (el.dataset.f === 'formation' && T.entries.length) { toast('Die Formation lässt sich nicht ändern, solange Meldungen in der Meldeliste stehen.'); render(); return; }
  if (el.dataset.f) { T[el.dataset.f] = el.value; save(); if (el.tagName === 'SELECT') render(); else { $('#tsel').selectedOptions[0].textContent = T.name; document.title = T.name + ' – Pétanque-Turnierleitung'; } return; }
  if (el.dataset.o) {
    const k = el.dataset.o; T.opts[k] = el.type === 'checkbox' ? el.checked : k === 'field' ? +el.value : el.type === 'number' ? Math.max(+el.min || 0, Math.min(+el.max || 999, Math.round(+el.value) || 0)) : el.value;
    if (k === 'courts' && T.started) assignCourts(T);
    save(); if (el.type !== 'number') render(); else el.value = T.opts[k];
    return;
  }
  if (el.id === 'imp-file' && el.files[0]) { const f = el.files[0]; el.value = '';
    readTable(f).then(rows => { let n; try { n = importRows(T, rows); } catch (err) { render(); return toast(err.message); } save(); render(); const d = importRows.dup; toast(n || d ? `${n} Einträge übernommen.` + (d ? ` ${d} ${d === 1 ? 'stand' : 'standen'} schon in der Meldeliste und ${d === 1 ? 'wurde' : 'wurden'} übersprungen.` : '') : 'In der Datei wurden keine Einträge gefunden.'); },
      () => toast('Die Datei konnte nicht gelesen werden. Bitte in Excel als .xlsx speichern und erneut versuchen.')); return; }
  if (el.id === 'pdb-file' && el.files[0]) {
    const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(String(r.result)), list = Array.isArray(d) ? d : d.players; if (!Array.isArray(list)) throw new Error('x'); let n = 0;
      list.forEach(x => { if (!x || (typeof x.first !== 'string' && typeof x.last !== 'string')) return; const p = pdbFind(String(x.first || ''), String(x.last || ''), String(x.club || ''));
        if (p) { p.n = Math.max(p.n || 0, +x.n || 0); if (x.club && !p.club) { p.club = String(x.club).trim(); } if (x.seen && String(x.seen) > (p.seen || '')) p.seen = String(x.seen); }
        else { pdb().push({ first: String(x.first || ''), last: String(x.last || ''), club: String(x.club || ''), n: +x.n || 0, seen: String(x.seen || '') }); n++; } });
      save(); render(); toast(`${n} neue Spieler übernommen.`); } catch (err) { toast('Diese Datei ist keine gültige Spielerdatenbank.'); } };
    r.readAsText(el.files[0]); return;
  }
});
const SUG = { row: -1, list: [], i: 0 };
function suggHide() { document.querySelectorAll('.sugg').forEach(s => { s.hidden = true; }); SUG.row = -1; SUG.list = []; }
function suggShow(row, field) {
  const v = id => ($('#' + id) || {}).value || '', q = (v('e-first-' + row) + ' ' + v('e-last-' + row)).trim(), box = $('#sugg-' + row);
  if (!box) return; if (q.length < 2) { suggHide(); return; }
  const T = cur(), inT = new Set(T.entries.flatMap(e => composeEntry(membersOf(e)).members.map(m => pidKey(m.first, m.last, m.club))));
  const list = pdbSearch(q, 8, field); if (!list.length) { suggHide(); return; }
  SUG.row = row; SUG.list = list; SUG.i = 0;
  box.innerHTML = list.map((p, i) => `<div class="sg ${i === 0 ? 'on' : ''}" data-sg="${i}"><b>${esc(p.first)} ${esc(p.last)}</b>${p.club ? ` <span>${esc(p.club)}</span>` : ''}${inT.has(pidKey(p.first, p.last, p.club)) ? ' <span class="tag">bereits gemeldet</span>' : ''}</div>`).join('');
  box.hidden = false;
}
function suggPick(i) {
  const p = SUG.list[i], r = SUG.row; if (!p) return;
  $('#e-first-' + r).value = p.first; $('#e-last-' + r).value = p.last; $('#e-club-' + r).value = p.club || '';
  suggHide(); const nx = $('#e-first-' + (r + 1)) || document.querySelector('[data-act="entry-save"]'); if (nx) nx.focus();
}
document.addEventListener('input', e => { const m = /^e-(first|last)-(\d+)$/.exec(e.target.id || ''); if (m) suggShow(+m[2], m[1]); if (e.target.id === 'pdb-q') { UI.pdbq = e.target.value; pdbRenderList(); } });
document.addEventListener('focusout', e => { if (/^e-(first|last)-/.test(e.target.id || '')) setTimeout(() => { const a = document.activeElement; if (!a || !/^e-(first|last)-/.test(a.id || '')) suggHide(); }, 120); });
document.addEventListener('mousedown', e => { const s = e.target.closest('[data-sg]'); if (s) { e.preventDefault(); suggPick(+s.dataset.sg); } });
document.addEventListener('keydown', e => {
  if (SUG.list.length && /^e-(first|last)-/.test(e.target.id || '')) {
    const box = $('#sugg-' + SUG.row), mark = () => box.querySelectorAll('.sg').forEach((x, i) => x.classList.toggle('on', i === SUG.i));
    if (e.key === 'ArrowDown') { e.preventDefault(); SUG.i = (SUG.i + 1) % SUG.list.length; mark(); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); SUG.i = (SUG.i + SUG.list.length - 1) % SUG.list.length; mark(); return; }
    if (e.key === 'Enter') { e.preventDefault(); suggPick(SUG.i); return; }
    if (e.key === 'Escape') { suggHide(); return; }
  }
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('sc')) { e.preventDefault(); const row = e.target.closest('.match'), ins = row.querySelectorAll('input.sc'); if (e.target === ins[0]) ins[1].focus(); else saveScore(row, true); return; }
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('e-inp')) { ACT['entry-save'](); return; }
});
applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
loadDB(); selDefault(cur());
render();
