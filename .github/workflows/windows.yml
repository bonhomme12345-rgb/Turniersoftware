name: Windows-Programm bauen

on:
  push:
    branches: [main]
    paths: ['index.html', 'desktop/**', '.github/workflows/windows.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: App-Datei übernehmen
        shell: bash
        run: mkdir -p desktop/app && cp index.html desktop/app/index.html
      - name: Bauen
        working-directory: desktop
        run: |
          npm ci
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Turnierleitung-Windows
          path: |
            desktop/dist/*.exe
          retention-days: 90
